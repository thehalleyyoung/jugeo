[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jugeo-webapp"
version = "0.1.0"
description = "Sheaf-theoretic web application synthesis, verification, and ideation — a JuGeo module"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Halley Young"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = [
    "flask",
    "web-application",
    "sheaf-theory",
    "verification",
    "code-generation",
    "ideation",
    "jugeo",
]

dependencies = []  # stdlib only — no runtime dependencies

[project.optional-dependencies]
flask = ["flask>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
]

[project.scripts]
jugeo-webapp = "jugeo.webapp.cli.webapp_command:main"

[project.urls]
Homepage = "https://github.com/halleyyoung/jugeo"
Documentation = "https://github.com/halleyyoung/jugeo/blob/main/GEOMETRY_OF_WEB_APPLICATIONS.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jugeo.webapp*"]

[tool.setuptools.package-data]
"jugeo.webapp" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --timeout=120 -q"
