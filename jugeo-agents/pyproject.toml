[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jugeo-agents"
version = "0.1.0"
description = "Sheaf-theoretic verification for multi-agent LLM systems — the type system for agent architectures"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "JuGeo Contributors" }]
keywords = ["llm", "agents", "verification", "trust", "multi-agent", "sheaf-theory", "jugeo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
dashboard = ["flask>=3.0", "flask-socketio>=5.3"]
crewai = ["crewai>=0.60"]
langgraph = ["langgraph>=0.2"]
autogen = ["autogen-agentchat>=0.4"]
nlp = ["spacy>=3.7"]
all = [
    "flask>=3.0",
    "flask-socketio>=5.3",
    "crewai>=0.60",
    "langgraph>=0.2",
    "autogen-agentchat>=0.4",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/jugeo/jugeo-agents"
Documentation = "https://github.com/jugeo/jugeo-agents#readme"
Repository = "https://github.com/jugeo/jugeo-agents"

[project.scripts]
jugeo-dashboard = "jugeo_agents.dashboard.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jugeo_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
