<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuGeo Agent Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>🔍 JuGeo Agent Verification Dashboard</h1>
        <div id="status-bar">
            <span id="phase-badge" class="badge">—</span>
            <span id="convergence-badge" class="badge">—</span>
            <span id="claims-count">0 claims</span>
            <span id="obstruction-count">0 obstructions</span>
            <button onclick="refresh()">↻ Refresh</button>
        </div>
    </header>

    <main>
        <!-- Trust summary panel -->
        <section id="trust-panel">
            <h2>Trust Distribution</h2>
            <div id="trust-bars"></div>
        </section>

        <!-- Agent panels -->
        <section id="agents-panel">
            <h2>Agents</h2>
            <div id="agents-grid"></div>
        </section>

        <!-- Obstructions panel -->
        <section id="obstructions-panel">
            <h2>Obstructions</h2>
            <div id="obstructions-list"></div>
        </section>

        <!-- Convergence chart -->
        <section id="convergence-panel">
            <h2>Convergence</h2>
            <canvas id="convergence-chart" width="800" height="300"></canvas>
        </section>

        <!-- Pipeline summary -->
        <section id="summary-panel">
            <h2>Pipeline Summary</h2>
            <pre id="summary-text"></pre>
        </section>
    </main>

    <script src="{{ url_for('static', filename='trust_viz.js') }}"></script>
    <script src="{{ url_for('static', filename='provenance_graph.js') }}"></script>
</body>
</html>
